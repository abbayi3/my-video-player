

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StreamHub</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
*{ box-sizing:border-box; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; }
body{ background:#0d0e12; color:#e1e4ed; }
header{ height:65px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; background:#13151c; border-bottom:1px solid #1f222e; position:sticky; top:0; z-index:50; }
.logo{ font-size:22px; font-weight:900; color:white; letter-spacing:-1px; cursor:pointer; }
.logo span{ color:#e50914; }
.search-container{ position:relative; width:45%; max-width:260px; }
.search{ width:100%; padding:8px 12px 8px 34px; border-radius:20px; border:1px solid #272b3c; background:#191c26; color:white; outline:none; font-size:12px; }
.search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6c7285; font-size: 11px; }
.suggestions-box { position:absolute; top:45px; left:0; width:100%; background:#13151c; border:1px solid #272b3c; border-radius:10px; max-height:250px; overflow-y:auto; z-index:1000; display:none; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
.suggestion-item { padding:10px 12px; border-bottom:1px solid #1f222e; cursor:pointer; font-size:12px; color:#e1e4ed; display:flex; align-items:center; gap:8px; }
.suggestion-item:hover { background:#e50914; color:white; font-weight:bold; }
.suggestion-item i { color: #a0a6b8; width: 14px; text-align: center; }
.suggestion-item:hover i { color: white; }
.menuBtn{ border:1px solid #272b3c; background:#191c26; color:white; padding:8px 12px; border-radius:8px; font-size:16px; cursor:pointer; }
.sidebar{ position:fixed; top:0; left:-280px; width:260px; height:100%; background:#13151c; border-right:1px solid #1f222e; z-index:300; transition:left 0.3s ease; padding:20px; display:flex; flex-direction:column; justify-content:space-between; overflow-y:auto; }
.sidebar.active{ left:0; }
.sidebar-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:299; display:none; }
.sidebar-header{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1f222e; padding-bottom:15px; margin-bottom:15px; }
.sidebar-menu-list button{ width:100%; text-align:left; background:none; border:none; color:#a0a6b8; padding:12px 10px; border-radius:8px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:0.2s; }
.sidebar-menu-list button:hover{ background:#e50914; color:white; font-weight:bold; }
.performers-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }
.performers-row::-webkit-scrollbar { display: none; }
.performer-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
.avatar-box { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #e50914; background: #191c26; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.avatar-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.performer-name { font-size: 10px; color: #a0a6b8; max-width: 65px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.categories-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; flex-shrink: 0; }
.categories-row::-webkit-scrollbar { display: none; }
.badge { background: #191c26; border: 1px solid #272b3c; color: #c2c7d6; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 16px; white-space: nowrap; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
.badge.active, .badge:hover { background: #e50914; border-color: #e50914; color: #fff; font-weight: bold; }
.section{ padding:15px 14px; }
.section-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.title{ font-size:16px; text-transform:capitalize; font-weight:bold; }
.see-more-btn{ color:#e50914; font-size:20px; font-weight:bold; cursor:pointer; user-select:none; }
.row{ display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; padding-bottom: 5px; }
.row::-webkit-scrollbar{ display:none; }

.movie{ width:150px; min-width:150px; cursor:pointer; background: transparent; border: none; flex-shrink: 0; }
.poster{ width:100%; height:95px; object-fit:cover; background:#191c26; display: block; border-radius: 8px; }
.movieName{ padding: 6px 2px 2px 2px; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; color: #e1e4ed; }
.movieMeta{ padding: 0 2px 6px 2px; color:#78838e; font-size:9px; text-transform:capitalize; display: flex; justify-content: space-between; }

.modal, .admin, .category-page, .actor-profile-page{ position:fixed; inset:0; display:none; background:rgba(0,0,0,.92); z-index:100; }
.category-page, .actor-profile-page{ background:#0d0e12; z-index:90; overflow-y:auto; }
.category-header{ height:65px; display:flex; align-items:center; gap:15px; padding:0 15px; background:#13151c; border-bottom:1px solid #1f222e; position:sticky; top:0; z-index:10; }
.back-btn{ background:none; border:none; color:white; font-size:22px; cursor:pointer; }
.category-title-head{ font-size:18px; font-weight:bold; text-transform:capitalize; }
.grid-container{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:12px; padding:15px; }

.actor-profile-banner { position: relative; width: 100%; height: 200px; background: #191c26; overflow: hidden; }

.actor-profile-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #e50914; background: #191c26; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
.actor-profile-info { display: flex; flex-direction: column; justify-content: center; }
.actor-profile-name { font-size: 18px; font-weight: bold; color: white; margin-bottom: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.actor-profile-sub { font-size: 12px; color: #bbb; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

.modal{ align-items:flex-start; justify-content:center; padding:15px 12px; overflow-y:auto; }
.modalBox{ width:100%; max-width:600px; background:#13151c; border-radius:12px; overflow:hidden; position:relative; max-height:92vh; overflow-y:auto; border:1px solid #272b3c; margin-top: 10px; }
.modalMediaContainer{ width:100%; aspect-ratio: 16/9; background:#000; position:relative; }
.modalImage{ width:100%; height:100%; object-fit:cover; display:block; }
.modalIframe{ width:100%; height:100%; border:0; display:none; }
.close-icon{ position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.7); color:white; border:0; width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer; z-index:10; }
.modalContent{ padding:16px; }
.modalContent h2{ font-size:18px; margin-bottom:12px; }

.modal-actor-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; cursor: pointer; background: #191c26; padding: 8px 12px; border-radius: 8px; border: 1px solid #272b3c; width: fit-content; }
.modal-actor-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #e50914; }
.modal-actor-name { font-size: 12px; font-weight: 600; color: #e1e4ed; }

.action-btns{ display:flex; gap:10px; margin-top:10px; }
.btn-action{ flex:1; padding:10px; border:0; border-radius:7px; font-weight:bold; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; text-align:center; }
.watch-btn{ background:#e50914; color:#fff; }
.admin{ background:#0d0e12; z-index:400; overflow-y:auto; }
.adminHeader{ height:65px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; border-bottom:1px solid #1f222e; position:sticky; top:0; background:#13151c; }
.adminHeader h2{ color:#e50914; font-size:18px; }
.adminContent{ max-width:600px; margin:auto; padding:20px; }
.group{ margin-bottom:15px; }
.group label{ display:block; color:#a0a6b8; font-size:12px; margin-bottom:6px; }
.group input{ width:100%; padding:10px; background:#191c26; color:white; border:1px solid #272b3c; border-radius:8px; outline:none; font-size:12px; }
.preview{ width:100px; height:60px; object-fit:cover; border-radius:6px; margin-top:8px; display:none; }
.addBtn{ width:100%; padding:12px; border:0; border-radius:8px; background:#e50914; color:white; font-weight:bold; cursor:pointer; margin-top:5px; font-size:13px; }
.cancelBtn{ background:#525868; width:100%; padding:10px; border:0; border-radius:8px; color:white; font-weight:bold; cursor:pointer; margin-top:5px; display:none; font-size:12px; }
.admin-card-section{ background:#13151c; border-radius:10px; border:1px solid #1f222e; margin-bottom:15px; overflow:hidden; }
.accordion-header{ display:flex; justify-content:space-between; align-items:center; padding:15px; cursor:pointer; user-select:none; }
.accordion-header h3{ font-size:15px; margin:0; }
.accordion-icon{ font-size:13px; font-weight:bold; }
.accordion-body{ padding:15px; border-top:1px solid #1f222e; display:none; }
.adminItem{ display:flex; align-items:center; gap:10px; background:#191c26; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #272b3c; }
.adminThumb{ width:60px; height:35px; object-fit:cover; border-radius:4px; }
.adminBtns{ display:flex; gap:6px; }
.editBtn{ background:#f39c12; color:white; border:0; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px; }
.deleteBtn{ background:#e50914; color:white; border:0; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px; }
footer{ text-align:center; color:#525868; padding:30px; font-size:11px; }
</style>
</head>

<script>
const BOT_TOKEN = "8878341217:AAEiTji01PpHaqkCZFmhkDyTSzlC4iSGKCQ";
const CHAT_ID = "-1004321136079";

let movies = JSON.parse(localStorage.getItem('local_videos') || '[]');
let performers = JSON.parse(localStorage.getItem('local_performers') || '[]');
let selectedMovie = null;
let activeTagFilter = '';

function loadAllData(){
  renderPerformers();
  renderCategoriesBar();
  renderMovies();
}
loadAllData();

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if (sidebar.classList.contains("active")) {
    sidebar.classList.remove("active");
    overlay.style.display = "none";
  } else {
    sidebar.classList.add("active");
    overlay.style.display = "block";
  }
}

function openAdminSecretly() {
  toggleSidebar();
  const pin = prompt("Enter PIN:");
  if(pin === "7890") {
    document.getElementById("adminPanel").style.display = "block";
  } else if(pin !== null) {
    alert("Invalid PIN!");
  }
}

function closeAdmin(){ document.getElementById("adminPanel").style.display="none"; }

function toggleAccordion(bodyId, iconId){
  const body = document.getElementById(bodyId);
  const icon = document.getElementById(iconId);
  if(body.style.display === "block"){
    body.style.display = "none";
    icon.textContent = "▼";
  } else {
    body.style.display = "block";
    icon.textContent = "▲";
  }
}

function parseStreamtapeId(input) {
  if (!input) return '';
  let target = input.trim();
  const srcMatch = target.match(/src=["']([^"']+)["']/);
  if (srcMatch) target = srcMatch[1];
  const match = target.match(/(?:streamtape\.(?:com|to|net|cc|site|xyz)\/(?:v|e)\/)([a-zA-Z0-9]+)/);
  if (match && match[1]) return match[1];
  return target.split('/')[0].trim();
}

document.getElementById("movieImage").addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const preview = document.getElementById("preview");
    preview.src = e.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

document.getElementById("actorImage").addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const preview = document.getElementById("actorPreview");
    preview.src = e.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

document.getElementById("actorBannerImage").addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const preview = document.getElementById("actorBannerPreview");
    preview.src = e.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

function renderPerformers() {
  const row = document.getElementById('performersRow');
  row.innerHTML = '';
  performers.forEach(p => {
    const item = document.createElement('div');
    item.className = 'performer-item';
    item.innerHTML = `
      <div class="avatar-box" onclick="openActorProfile('${escapeHTML(p.name)}')">
        ${p.image_url ? `<img src="${p.image_url}" referrerpolicy="no-referrer">` : '<i class="fa-solid fa-user" style="color:#555"></i>'}
      </div>
      <span class="performer-name" onclick="openActorProfile('${escapeHTML(p.name)}')">${p.name}</span>
    `;
    row.appendChild(item);
  });
}

function renderCategoriesBar() {
  const row = document.getElementById('categoriesRow');
  row.innerHTML = '';

  const allBadge = document.createElement('span');
  allBadge.className = `badge ${activeTagFilter === '' ? 'active' : ''}`;
  allBadge.textContent = 'All';
  allBadge.onclick = () => filterByTag('');
  row.appendChild(allBadge);

  let allTags = [];
  movies.forEach(m => {
    if(m.tags) {
      m.tags.split(',').forEach(t => {
        let clean = t.trim();
        if(clean && !allTags.includes(clean)) allTags.push(clean);
      });
    }
  });

  allTags.forEach(tag => {
    const badge = document.createElement('span');
    badge.className = `badge ${activeTagFilter.toLowerCase() === tag.toLowerCase() ? 'active' : ''}`;
    badge.textContent = tag;
    badge.onclick = () => filterByTag(tag);
    row.appendChild(badge);
  });
}

function showAllHomeMovies(){
  closeCategoryPage();
  closeActorProfilePage();
  activeTagFilter = '';
  renderCategoriesBar();
  renderMovies();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderMovies(){
  const container = document.getElementById("dynamicCategoriesContainer");
  container.innerHTML = "";

  let listToDisplay = movies;
  if(activeTagFilter !== '') {
    listToDisplay = movies.filter(m => {
      if(!m.tags) return false;
      return m.tags.split(',').map(t => t.trim().toLowerCase()).includes(activeTagFilter.toLowerCase());
    });
  }

  let allCategories = [...new Set(listToDisplay.map(m => m.category ? m.category.trim() : "General"))];

  allCategories.forEach(cat => {
    const categoryMovies = listToDisplay.filter(m => (m.category ? m.category.trim() : "General") === cat);

    if (categoryMovies.length > 0) {
      const section = document.createElement("section");
      section.className = "section";
      
      const headerDiv = document.createElement("div");
      headerDiv.className = "section-header";

      const titleDiv = document.createElement("div");
      titleDiv.className = "title";
      titleDiv.textContent = cat;

      const seeMoreBtn = document.createElement("div");
      seeMoreBtn.className = "see-more-btn";
      seeMoreBtn.innerHTML = "›";
      seeMoreBtn.onclick = function(){ openFilteredPage(cat); };

      headerDiv.appendChild(titleDiv);
      headerDiv.appendChild(seeMoreBtn);
      section.appendChild(headerDiv);

      const rowDiv = document.createElement("div");
      rowDiv.className = "row";

      categoryMovies.forEach(movie => {
        rowDiv.appendChild(createCard(movie));
      });

      section.appendChild(rowDiv);
      container.appendChild(section);
    }
  });

  renderAdmin();
}

function openFilteredPage(queryValue){
  const page = document.getElementById("categoryPage");
  const titleHead = document.getElementById("categoryPageTitle");
  const grid = document.getElementById("categoryGrid");

  titleHead.textContent = queryValue;
  grid.innerHTML = "";

  const qLower = queryValue.toLowerCase();
  const filteredItems = movies.filter(m => {
    const cat = (m.category || "").toLowerCase();
    const title = (m.title || "").toLowerCase();
    const tags = (m.tags || "").toLowerCase();
    const actor = (m.actor || "").toLowerCase();
    return cat === qLower || title.includes(qLower) || tags.includes(qLower) || actor.includes(qLower);
  });

  filteredItems.forEach(movie => {
    const card = document.createElement("div");
    card.className = "grid-movie";
    card.onclick = function(){ openMovie(movie); };
    const imgUrl = movie.poster_url || movie.thumbnail_url || "";
    card.innerHTML = `
      <img class="grid-poster" src="${imgUrl}" loading="lazy">
      <div class="movieName">${escapeHTML(movie.title)}</div>
      <div class="movieMeta"><span>HD Quality</span><span>10.2k views</span></div>
    `;
    grid.appendChild(card);
  });

  page.style.display = "block";
}

function closeCategoryPage(){
  document.getElementById("categoryPage").style.display = "none";
}

function openActorProfile(actorName) {
  const page = document.getElementById("actorProfilePage");
  const avatarEl = document.getElementById("actorProfileAvatar");
  const bannerEl = document.getElementById("actorProfileBannerImg");
  const nameEl = document.getElementById("actorProfileName");
  const countEl = document.getElementById("actorProfileCount");
  const grid = document.getElementById("actorProfileGrid");

  const performerObj = performers.find(p => p.name.toLowerCase() === actorName.toLowerCase());
  avatarEl.src = performerObj && performerObj.image_url ? performerObj.image_url : "";
  bannerEl.src = performerObj && performerObj.banner_url ? performerObj.banner_url : (performerObj && performerObj.image_url ? performerObj.image_url : "");
  nameEl.textContent = actorName;

  const actorMovies = movies.filter(m => {
    const aField = (m.actor || "").toLowerCase();
    const titleField = (m.title || "").toLowerCase();
    const catField = (m.category || "").toLowerCase();
    const nameLower = actorName.toLowerCase();
    return aField === nameLower || titleField.includes(nameLower) || catField.includes(nameLower);
  });

  countEl.textContent = `${actorMovies.length} Videos`;
  grid.innerHTML = "";

  if(actorMovies.length === 0) {
    grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; text-align:center; padding:20px;">No videos found for this actor.</p>`;
  } else {
    actorMovies.forEach(movie => {
      const card = document.createElement("div");
      card.className = "grid-movie";
      card.onclick = function(){ openMovie(movie); };
      const imgUrl = movie.poster_url || movie.thumbnail_url || "";
      card.innerHTML = `
        <img class="grid-poster" src="${imgUrl}" loading="lazy">
        <div class="movieName">${escapeHTML(movie.title)}</div>
        <div class="movieMeta"><span>HD</span><span>12k views</span></div>
      `;
      grid.appendChild(card);
    });
  }

  page.style.display = "block";
}

function closeActorProfilePage(){
  document.getElementById("actorProfilePage").style.display = "none";
}

function createCard(movie){
  const card = document.createElement("div");
  card.className = "movie";
  card.onclick = function(){ openMovie(movie); };

  const imgUrl = movie.poster_url || movie.thumbnail_url || "";
  card.innerHTML = `
    <img class="poster" src="${imgUrl}" loading="lazy">
    <div class="movieName">${escapeHTML(movie.title)}</div>
    <div class="movieMeta"><span>HD</span><span>12k views</span></div>
  `;
  return card;
}

function escapeHTML(text){
  return String(text||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

async function saveMovie(){
  const editId = document.getElementById("editMovieId").value;
  const title = document.getElementById("movieTitle").value.trim();
  const codeInput = document.getElementById("movieLink").value.trim();
  const category = document.getElementById("movieCategory").value.trim() || "General";
  const tags = document.getElementById("movieTags").value.trim();
  const actor = document.getElementById("movieActor").value.trim();
  const file = document.getElementById("movieImage").files[0];

  if(!title || !codeInput) return alert("Title and Code/Link required!");

  const fileCode = parseStreamtapeId(codeInput);
  let posterUrl = document.getElementById("preview").src;
  if(!posterUrl || posterUrl === window.location.href) posterUrl = "";

  if(file){
    posterUrl = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  if(editId) {
    movies = movies.map(m => m.id == editId ? { ...m, title, file_code: fileCode, category, tags, actor, poster_url: posterUrl } : m);
    alert("✅ Video Updated!");
  } else {
    const newMovie = { id: Date.now(), title, file_code: fileCode, poster_url: posterUrl, category, tags, actor };
    movies.unshift(newMovie);
    
    const text = `🚀 New Video Added!\n\n📌 Title: ${title}\n📂 Category: ${category}\n🔗 Link: https://streamtape.to/v/${fileCode}`;
    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=` + encodeURIComponent(text));
    } catch(e) {}

    alert("✅ Video Added & Synced to Telegram!");
  }

  localStorage.setItem('local_videos', JSON.stringify(movies));
  resetVideoForm();
  loadAllData();
}

function editMovie(id) {
  const m = movies.find(item => item.id == id);
  if(!m) return;
  document.getElementById("editMovieId").value = m.id;
  document.getElementById("movieTitle").value = m.title;
  document.getElementById("movieLink").value = m.file_code;
  document.getElementById("movieCategory").value = m.category || "";
  document.getElementById("movieTags").value = m.tags || "";
  document.getElementById("movieActor").value = m.actor || "";
  
  const preview = document.getElementById("preview");
  const imgUrl = m.poster_url || m.thumbnail_url;
  if(imgUrl) {
    preview.src = imgUrl;
    preview.style.display = "block";
  }

  document.getElementById("videoFormTitle").textContent = "✏️ Edit Video Entry";
  document.getElementById("videoSubmitBtn").textContent = "Update Video";
  document.getElementById("videoCancelBtn").style.display = "block";
  document.getElementById("secMovie").style.display = "block";
  document.getElementById("iconMovie").textContent = "▲";
}

function resetVideoForm() {

async function saveActor(){
  const editId = document.getElementById("editActorId").value;
  const name = document.getElementById("actorName").value.trim();
  const file = document.getElementById("actorImage").files[0];
  const bannerFile = document.getElementById("actorBannerImage").files[0];

  if(!name) return alert("Actor name required!");

  let imageUrl = document.getElementById("actorPreview").src;
  if(!imageUrl || imageUrl === window.location.href) imageUrl = "";

  if(file){
    imageUrl = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  let bannerUrl = document.getElementById("actorBannerPreview").src;
  if(!bannerUrl || bannerUrl === window.location.href) bannerUrl = "";

  if(bannerFile){
    bannerUrl = await new Promise(resolve => {
      const reader2 = new FileReader();
      reader2.onload = e => resolve(e.target.result);
      reader2.readAsDataURL(bannerFile);
    });
  }

  if(editId) {
    performers = performers.map(p => p.id == editId ? { ...p, name, image_url: imageUrl, banner_url: bannerUrl } : p);
    alert("✅ Actor Updated!");
  } else {
    const newActor = { id: Date.now(), name, image_url: imageUrl, banner_url: bannerUrl };
    performers.unshift(newActor);

    const text = `👤 New Performer / Actor Added!\n\n🌟 Name: ${name}`;
    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=` + encodeURIComponent(text));
    } catch(e) {}

    alert("✅ Actor Added & Synced to Telegram!");
  }

  localStorage.setItem('local_performers', JSON.stringify(performers));
  resetActorForm();
  loadAllData();
}

function deleteMovie(id){
  if(!confirm("Delete video?")) return;
  movies = movies.filter(item => item.id != id);
  localStorage.setItem('local_videos', JSON.stringify(movies));
  loadAllData();
}

function deleteActor(id){
  if(!confirm("Delete performer?")) return;
  performers = performers.filter(item => item.id != id);
  localStorage.setItem('local_performers', JSON.stringify(performers));
  loadAllData();
}

function openMovie(movie){
  selectedMovie = movie;
  document.getElementById("modalTitle").textContent = movie.title;
  const imgElement = document.getElementById("modalImage");
  const iframeElement = document.getElementById("modalTrailerFrame");

  iframeElement.style.display = "none";
  iframeElement.src = "";
  imgElement.style.display = "block";
  imgElement.src = movie.poster_url || movie.thumbnail_url || "";

  const actorContainer = document.getElementById("modalActorContainer");
  let matchedActorName = movie.actor ? movie.actor.trim() : "";
  let matchedActor = performers.find(p => p.name.toLowerCase() === matchedActorName.toLowerCase());
  
  if(!matchedActor) {
    matchedActor = performers.find(p => movie.title.toLowerCase().includes(p.name.toLowerCase()) || (movie.category && movie.category.toLowerCase().includes(p.name.toLowerCase())));
  }

  if(matchedActor) {
    document.getElementById("modalActorAvatar").src = matchedActor.image_url || "";
    document.getElementById("modalActorName").textContent = matchedActor.name;
    actorContainer.style.display = "flex";
    actorContainer.dataset.actorName = matchedActor.name;
  } else if(movie.actor) {
    document.getElementById("modalActorAvatar").src = "";
    document.getElementById("modalActorName").textContent = movie.actor;
    actorContainer.style.display = "flex";
    actorContainer.dataset.actorName = movie.actor;
  } else {
    actorContainer.style.display = "none";
  }

  document.getElementById("movieModal").style.display = "flex";
}

function openActorProfileFromModal(){
  const actorContainer = document.getElementById("modalActorContainer");
  const actorName = actorContainer.dataset.actorName;
  if(actorName) {
    closeMovie();
    openActorProfile(actorName);
  }
}

  if(!selectedMovie) return;

function filterByTag(tag) {
  activeTagFilter = tag;
  renderCategoriesBar();

  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById("search").addEventListener("input", function(){
  const q = this.value.toLowerCase().trim();
  const sugBox = document.getElementById("suggestions");
  sugBox.innerHTML = "";
  
  if(!q){
    sugBox.style.display = "none";
    return;
  }

  let resultsCount = 0;

  performers.forEach(p => {
    if(p.name.toLowerCase().includes(q)) {
      resultsCount++;
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.innerHTML = `<i class="fa-solid fa-user"></i> <span>Actor: <b>${escapeHTML(p.name)}</b></span>`;
      item.onclick = function(){
        sugBox.style.display = "none";
        document.getElementById("search").value = "";
        openActorProfile(p.name);
      };
      sugBox.appendChild(item);
    }
  });

  let uniqueCategories = [...new Set(movies.map(m => m.category ? m.category.trim() : ""))].filter(Boolean);
  uniqueCategories.forEach(cat => {
    if(cat.toLowerCase().includes(q)) {
      resultsCount++;
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.innerHTML = `<i class="fa-solid fa-folder"></i> <span>Category: <b>${escapeHTML(cat)}</b></span>`;
      item.onclick = function(){
        sugBox.style.display = "none";
        document.getElementById("search").value = "";
        openFilteredPage(cat);
      };
      sugBox.appendChild(item);
    }
  });

  let uniqueTags = [];
  movies.forEach(m => {
    if(m.tags) {
      m.tags.split(',').forEach(t => {
        let clean = t.trim();
        if(clean && !uniqueTags.includes(clean)) uniqueTags.push(clean);
      });
    }
  });
  uniqueTags.forEach(tag => {
    if(tag.toLowerCase().includes(q)) {
      resultsCount++;
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.innerHTML = `<i class="fa-solid fa-tag"></i> <span>Tag: <b>${escapeHTML(tag)}</b></span>`;
      item.onclick = function(){
        sugBox.style.display = "none";
        document.getElementById("search").value = "";
        filterByTag(tag);
      };
      sugBox.appendChild(item);
    }
  });

  movies.forEach(movie => {
    if(movie.title.toLowerCase().includes(q)) {
      resultsCount++;
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.innerHTML = `<i class="fa-solid fa-video"></i> <span>Video: <b>${escapeHTML(movie.title)}</b></span>`;
      item.onclick = function(){
        sugBox.style.display = "none";
        document.getElementById("search").value = "";
        openMovie(movie);
      };
      sugBox.appendChild(item);
    }
  });

  if(resultsCount > 0){
    sugBox.style.display = "block";
  } else {
    sugBox.style.display = "none";
  }
});

document.getElementById("search").addEventListener("keypress", function(e){
  if(e.key === "Enter") {
    const q = this.value.trim();
    if(q) openFilteredPage(q);
    document.getElementById("suggestions").style.display = "none";
  }
});

document.addEventListener("click", function(e){
  if(!e.target.closest(".search-container")){
    document.getElementById("suggestions").style.display = "none";
  }
});
