<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StreamHub - Glassmorphism Edition</title>

<style>
:root {
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #070a12 100%);
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-header: rgba(15, 23, 42, 0.85);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --text-color: #f1f5f9;
  --subtext-color: #94a3b8;
  --accent-color: #e50914;
}

[data-theme="light"] {
  --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
  --glass-bg: rgba(255, 255, 255, 0.45);
  --glass-header: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(255, 255, 255, 0.3);
  --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
  --text-color: #0f172a;
  --subtext-color: #475569;
  --accent-color: #e50914;
}

*{ box-sizing:border-box; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; }

body{ 
  background: var(--bg-gradient); 
  background-attachment: fixed;
  color: var(--text-color); 
  min-height: 100vh;
  transition: all 0.3s ease; 
}

/* Glassmorphism Header */
header{ 
  height:65px; 
  display:flex; 
  align-items:center; 
  justify-content:space-between; 
  padding:0 14px; 
  background: var(--glass-header); 
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border); 
  position:sticky; 
  top:0; 
  z-index:50; 
  box-shadow: var(--glass-shadow);
}

.logo{ font-size:22px; font-weight:900; color:var(--text-color); letter-spacing:-1px; cursor:pointer; }
.logo span{ color:var(--accent-color); }

.header-actions { display: flex; align-items: center; gap: 8px; }

.theme-toggle-btn, .menuBtn { 
  background: var(--glass-bg); 
  border: 1px solid var(--glass-border); 
  color: var(--text-color); 
  padding: 8px 12px; 
  border-radius: 12px; 
  font-size: 14px; 
  cursor: pointer; 
  backdrop-filter: blur(8px);
  transition: transform 0.2s ease, background 0.2s ease;
}

.theme-toggle-btn:active, .menuBtn:active { transform: scale(0.92); }

.search-container{ position:relative; width:40%; max-width:220px; }

.search{ 
  width:100%; 
  padding:8px 12px 8px 32px; 
  border-radius:20px; 
  border:1px solid var(--glass-border); 
  background:var(--glass-bg); 
  color:var(--text-color); 
  outline:none; 
  font-size:12px; 
  backdrop-filter: blur(10px);
}

.search-icon-inside { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; }

.suggestions-box { 
  position:absolute; 
  top:48px; 
  left:0; 
  width:100%; 
  background:var(--glass-header); 
  border:1px solid var(--glass-border); 
  border-radius:14px; 
  max-height:250px; 
  overflow-y:auto; 
  z-index:1000; 
  display:none; 
  backdrop-filter: blur(20px);
  box-shadow: var(--glass-shadow); 
}

.suggestion-item { padding:10px 12px; border-bottom:1px solid var(--glass-border); cursor:pointer; font-size:12px; color:var(--text-color); display:flex; align-items:center; gap:8px; }
.suggestion-item:hover { background:var(--accent-color); color:white; font-weight:bold; }

/* Sidebar */
.sidebar{ 
  position:fixed; 
  top:0; 
  left:-290px; 
  width:270px; 
  height:100%; 
  background:var(--glass-header); 
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-right:1px solid var(--glass-border); 
  z-index:300; 
  transition: left 0.3s ease; 
  padding:20px; 
  display:flex; 
  flex-direction:column; 
  justify-content:space-between; 
}
.sidebar.active{ left:0; }
.sidebar-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index:299; display:none; }

.sidebar-header{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:15px; margin-bottom:15px; }
.sidebar-menu-list button{ width:100%; text-align:left; background:none; border:none; color:var(--subtext-color); padding:12px 10px; border-radius:10px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:0.3s ease; }
.sidebar-menu-list button:hover{ background:var(--accent-color); color:white; font-weight:bold; }

/* Tags Row (Top) */
.categories-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; flex-shrink: 0; }
.categories-row::-webkit-scrollbar { display: none; }
.badge { 
  background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-color); font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 20px; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(10px); 
}
.badge.active, .badge:hover { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }

/* Promotional Banner Ad Section */
.promo-banner-container {
  padding: 10px 14px;
  width: 100%;
}
.promo-banner {
  width: 100%;
  height: 200px;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  cursor: pointer;
  background: var(--glass-bg);
}
.promo-banner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.promo-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.7);
  color: #fbbf24;
  font-size: 9px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 6px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(251, 191, 36, 0.3);
  z-index: 5;
}

/* Performers Row */
.performers-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }
.performers-row::-webkit-scrollbar { display: none; }
.performer-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }

.avatar-box { 
  width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent-color); background: var(--glass-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; backdrop-filter: blur(10px); box-shadow: var(--glass-shadow); 
}
.avatar-box img { width: 100%; height: 100%; object-fit: cover; }
.performer-name { font-size: 10px; color: var(--subtext-color); max-width: 65px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

.section{ padding:15px 14px; }
.section-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.title{ font-size:16px; text-transform:capitalize; font-weight:bold; }
.see-more-btn{ color:var(--accent-color); font-size:20px; font-weight:bold; cursor:pointer; }

.row{ display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; padding-bottom: 5px; }
.movie{ width:150px; min-width:150px; cursor:pointer; background: transparent; border: none; flex-shrink: 0; }

.poster-box { 
  width:100%; height:95px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius:12px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; backdrop-filter: blur(10px); box-shadow: var(--glass-shadow); 
}
.poster-box img { width:100%; height:100%; object-fit:cover; }
.movieName{ padding: 6px 2px 2px 2px; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; color: var(--text-color); }
.movieMeta{ padding: 0 2px 6px 2px; color:var(--subtext-color); font-size:9px; display: flex; justify-content: space-between; }

/* Fixed Pages */
.category-page, .actor-profile-page{ 
  position:fixed; inset:0; display:none; background: var(--bg-gradient); z-index:90; overflow-y:auto; 
}
.category-page.active, .actor-profile-page.active { display: block; }

.category-header{ height:65px; display:flex; align-items:center; gap:15px; padding:0 15px; background:var(--glass-header); border-bottom:1px solid var(--glass-border); position:sticky; top:0; z-index:10; backdrop-filter: blur(16px); }
.back-btn{ background:none; border:none; color:var(--text-color); font-size:22px; cursor:pointer; }

.grid-container{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; padding:15px; width:100%; }
.grid-movie{ cursor:pointer; width:100%; display: flex; flex-direction: column; }
.grid-poster { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; border: 1px solid var(--glass-border); }

/* Actor Profile Styles */
.actor-profile-banner { position: relative; width: 100%; height: 180px; background: var(--glass-bg); overflow: hidden; }
.actor-profile-banner img { width: 100%; height: 100%; object-fit: cover; }
.actor-profile-header { display: flex; align-items: center; gap: 16px; padding: 15px; position: relative; margin-top: -35px; margin-left: 5px; width: calc(100% - 10px); }
.actor-profile-avatar { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); background: var(--glass-bg); flex-shrink: 0; box-shadow: var(--glass-shadow); }

/* Full-Screen Free Video Modal */
.modal{ 
  position:fixed; inset:0; display:none; background:var(--bg-gradient); z-index:500; overflow-y:auto; 
}
.modal.active { display: block; }

.modalBox{ 
  width:100%; max-width:700px; margin:0 auto; min-height:100vh; background:transparent; position:relative; padding-bottom:30px;
}

.modalMediaContainer{ width:100%; aspect-ratio: 16/9; background:#000; position:relative; }
.modalImage{ width:100%; height:100%; object-fit:cover; }
.modalIframe, .modalVideo{ width:100%; height:100%; border:0; display:none; position:absolute; inset:0; }
.close-icon{ position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.7); color:white; border:0; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; z-index:20; backdrop-filter: blur(6px); border:1px solid var(--glass-border); }
.modalContent{ padding:20px 15px; }

.modal-actor-info { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer; background: var(--glass-bg); padding: 8px 14px; border-radius: 12px; border: 1px solid var(--glass-border); width: fit-content; }
.modal-actor-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color); display: none; }

.action-btns{ display:flex; gap:10px; margin-top:10px; margin-bottom: 25px; }
.btn-action{ flex:1; padding:12px; border:0; border-radius:12px; font-weight:bold; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; }
.watch-btn{ background:var(--accent-color); color:#fff; }

.modal-suggestions-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; color: var(--text-color); }

/* Admin Panel */
.admin{ position:fixed; inset:0; display:none; background:var(--bg-gradient); z-index:400; overflow-y:auto; flex-direction: column; }
.admin.active { display: flex; }

.adminHeader{ height:65px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; border-bottom:1px solid var(--glass-border); position:sticky; top:0; background:var(--glass-header); backdrop-filter: blur(16px); }
.adminContent{ max-width:600px; margin:auto; padding:20px; width:100%; }
.group{ margin-bottom:15px; }
.group label{ display:block; color:var(--subtext-color); font-size:12px; margin-bottom:6px; }
.group input, .group select{ width:100%; padding:12px; background:var(--glass-bg); color:var(--text-color); border:1px solid var(--glass-border); border-radius:12px; outline:none; font-size:12px; }
.group select option { background: #0f172a; color: #fff; }

.addBtn{ width:100%; padding:12px; border:0; border-radius:12px; background:var(--accent-color); color:white; font-weight:bold; cursor:pointer; margin-top:5px; }
.admin-card-section{ background:var(--glass-header); border-radius:16px; border:1px solid var(--glass-border); margin-bottom:15px; overflow:hidden; backdrop-filter: blur(15px); }
.accordion-header{ display:flex; justify-content:space-between; align-items:center; padding:15px; cursor:pointer; }
.accordion-body{ padding:15px; border-top:1px solid var(--glass-border); display:none; }

.adminItem{ display:flex; align-items:center; gap:10px; background:var(--glass-bg); padding:10px; margin-top:10px; border-radius:12px; border:1px solid var(--glass-border); }
.adminThumb{ width:60px; height:35px; object-fit:cover; border-radius:6px; }

footer{ text-align:center; color:var(--subtext-color); padding:30px; font-size:11px; }
</style>
</head>

<body data-theme="dark">

<header>
  <div class="logo" onclick="showAllHomeMovies()">stream<span>hub</span></div>
  <div class="search-container">
    <span class="search-icon-inside">🔍</span>
    <input id="search" class="search" placeholder="Search videos, actors..." autocomplete="off">
    <div id="suggestions" class="suggestions-box"></div>
  </div>
  <div class="header-actions">
    <button class="theme-toggle-btn" onclick="toggleTheme()"><span id="themeIcon">☀️</span></button>
    <button class="menuBtn" onclick="toggleSidebar()">☰</button>
  </div>
</header>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar" class="sidebar">
  <div>
    <div class="sidebar-header">
      <span style="font-weight:900; font-size:18px;">stream<span style="color:var(--accent-color);">hub</span></span>
      <button style="background:none; border:none; color:var(--text-color); font-size:18px; cursor:pointer;" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-menu-list">
      <button onclick="showAllHomeMovies()">🏠 Home</button>
      <button onclick="openAdminSecretly()">⚙️ Admin Panel</button>
    </div>
  </div>
  <div style="font-size:11px; color:var(--subtext-color); text-align:center; padding-top:20px;">StreamHub Glass Edition</div>
</div>

<!-- 1. Tags Row (Top) -->
<div class="section" style="padding-top: 12px; padding-bottom: 0;">
  <div id="categoriesRow" class="categories-row"></div>
</div>

<!-- 2. Promo Banner Ad Container -->
<div id="promoBannerWrapper" class="promo-banner-container" style="display:none;"></div>

<!-- 3. Performers Row -->
<div class="section" style="padding-top: 0; padding-bottom: 5px;">
  <div id="performersRow" class="performers-row"></div>
</div>

<!-- 4. Categories & Videos Grid -->
<div id="dynamicCategoriesContainer"></div>

<footer>© 2026 StreamHub</footer>

<!-- Category Page View -->
<div id="categoryPage" class="category-page">
  <div class="category-header">
    <button class="back-btn" onclick="closeCategoryPage()">←</button>
    <div id="categoryPageTitle" class="category-title-head">Category</div>
  </div>
  <div id="categoryGrid" class="grid-container"></div>
</div>

<!-- Actor Profile Page View -->
<div id="actorProfilePage" class="actor-profile-page">
  <div class="category-header">
    <button class="back-btn" onclick="closeActorProfilePage()">←</button>
    <div class="category-title-head">Actor Profile</div>
  </div>
  
  <div class="actor-profile-banner">
    <img id="actorProfileBannerImg" src="" alt="Banner">
  </div>
  
  <div class="actor-profile-header">
    <img id="actorProfileAvatar" class="actor-profile-avatar" src="" onerror="this.style.display='none'">
    <div class="actor-profile-info">
      <div id="actorProfileName" class="actor-profile-name" style="font-size:18px; font-weight:bold;"></div>
      <div id="actorProfileCount" class="actor-profile-sub" style="font-size:12px; color:var(--subtext-color);">0 Videos</div>
    </div>
  </div>

  <div id="actorProfileGrid" class="grid-container" style="margin-top: 10px;"></div>
</div>

<!-- Video Modal (Avcaption & Clean Player support) -->
<div id="movieModal" class="modal">
  <div class="modalBox">
    <button class="close-icon" onclick="closeMovie()">✕</button>
    <div class="modalMediaContainer">
      <img id="modalImage" class="modalImage" src="">
      <!-- Avcaption compatible iframe & video player configuration -->
      <iframe id="modalTrailerFrame" class="modalIframe" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
      <video id="modalVideoPlayer" class="modalVideo" controls autoplay></video>
    </div>
    <div class="modalContent">
      <h2 id="modalTitle" style="font-size:20px; margin-bottom:12px;"></h2>
      
      <div id="modalActorContainer" class="modal-actor-info" style="display:none;" onclick="openActorProfileFromModal()">
        <img id="modalActorAvatar" class="modal-actor-avatar" src="" onerror="this.style.display='none'">
        <span id="modalActorName" class="modal-actor-name"></span>
      </div>

      <div class="action-btns">
        <a id="watchMovieAnchor" class="btn-action watch-btn" href="javascript:void(0)" onclick="handleWatchClick()">▶ Play Video</a>
        <button class="btn-action" style="background:var(--glass-bg); color:var(--text-color); flex: 0.4; border:1px solid var(--glass-border);" onclick="shareVideo()">🔗 Share</button>
      </div>

      <!-- Category Suggestions Section inside Video Modal -->
      <div class="modal-suggestions-title">Recommended Videos</div>
      <div id="modalSuggestionsGrid" class="grid-container" style="padding:0; margin-top:10px;"></div>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel" class="admin">
  <div class="adminHeader">
    <h2>⚙️ Admin Panel</h2>
    <button class="addBtn" style="background:var(--glass-bg); color:var(--text-color); width:auto; padding:6px 12px; border:1px solid var(--glass-border);" onclick="closeAdmin()">✕ Close</button>
  </div>
  <div class="adminContent">
    
    <!-- Video Form Section -->
    <div class="admin-card-section">
      <div class="accordion-header" onclick="toggleAccordion('secMovie', 'iconMovie')">
        <h3 id="videoFormTitle" style="color:var(--accent-color);">🎬 Add Video Entry</h3>
        <span id="iconMovie">▼</span>
      </div>
      <div id="secMovie" class="accordion-body">
        <input type="hidden" id="editMovieId">
        <div class="group"><label>Video Title</label><input id="movieTitle" placeholder="Title"></div>
        <div class="group"><label>Avcaption Embed Link / Direct Video URL / MP4 / M3U8</label><input id="movieLink" placeholder="Paste Avcaption embed link here..."></div>
        <div class="group"><label>Category Name</label><input id="movieCategory" placeholder="e.g. Movies, Series..."></div>
        <div class="group"><label>Tags (Comma separated)</label><input id="movieTags" placeholder="e.g. HD, 4K, Popular"></div>
        <div class="group">
          <label>Actor Name</label>
          <input id="movieActor" list="actorSuggestions" placeholder="Actor Name">
          <datalist id="actorSuggestions"></datalist>
        </div>
        <div class="group">
          <label>Thumbnail Poster</label>
          <input id="movieImage" type="file" accept="image/*">
          <img id="preview" style="width:100px; height:60px; object-fit:cover; border-radius:6px; margin-top:8px; display:none;">
        </div>
        <button id="videoSubmitBtn" class="addBtn" onclick="saveMovie()">Save Video</button>
        <button id="videoCancelBtn" class="addBtn" style="background:#525868; display:none;" onclick="resetVideoForm()">Cancel Edit</button>
      </div>
    </div>

    <!-- Actor Form Section -->
    <div class="admin-card-section">
      <div class="accordion-header" onclick="toggleAccordion('secActor', 'iconActor')">
        <h3 id="actorFormTitle" style="color:var(--accent-color);">👤 Add Actor / Performer</h3>
        <span id="iconActor">▼</span>
      </div>
      <div id="secActor" class="accordion-body">
        <input type="hidden" id="editActorId">
        <div class="group"><label>Actor Name</label><input id="actorName" placeholder="Performer name"></div>
        
        <div class="group">
          <label>Actor Profile Avatar</label>
          <input id="actorImage" type="file" accept="image/*">
          <img id="actorPreview" style="width:100px; height:60px; object-fit:cover; border-radius:6px; margin-top:8px; display:none;">
        </div>

        <div class="group">
          <label>Actor Banner Thumbnail</label>
          <input id="actorBannerImage" type="file" accept="image/*">
          <img id="actorBannerPreview" style="width:100px; height:60px; object-fit:cover; border-radius:6px; margin-top:8px; display:none;">
        </div>

        <button id="actorSubmitBtn" class="addBtn" onclick="saveActor()">Save Actor</button>
        <button id="actorCancelBtn" class="addBtn" style="background:#525868; display:none;" onclick="resetActorForm()">Cancel Edit</button>
      </div>
    </div>

    <!-- Ads Manager Section -->
    <div class="admin-card-section">
      <div class="accordion-header" onclick="toggleAccordion('secAd', 'iconAd')">
        <h3 id="adFormTitle" style="color:#fbbf24;">📢 Manage Banner Ads</h3>
        <span id="iconAd">▼</span>
      </div>
      <div id="secAd" class="accordion-body">
        <input type="hidden" id="editAdId">
        <div class="group"><label>Ad Title / Description</label><input id="adTitle" placeholder="e.g. Special Offer Ad"></div>
        
        <div class="group">
          <label>Ad Banner Image</label>
          <input id="adImageFile" type="file" accept="image/*">
          <img id="adPreview" style="width:100px; height:60px; object-fit:cover; border-radius:6px; margin-top:8px; display:none;">
        </div>

        <div class="group">
          <label>Link Type</label>
          <select id="adTargetType" onchange="toggleAdTargetInputs()">
            <option value="url">External Website / Direct URL</option>
            <option value="video">Specific Video</option>
            <option value="category">Category</option>
            <option value="actor">Actor Profile</option>
            <option value="tag">Tag (e.g. Recently Added)</option>
          </select>
        </div>

        <div class="group" id="adTargetValueContainer">
          <label id="adTargetLabel">Target URL</label>
          <input id="adTargetValue" placeholder="https://example.com or Video ID / Category name...">
        </div>

        <button id="adSubmitBtn" class="addBtn" style="background:#fbbf24; color:#000;" onclick="saveAd()">Save Banner Ad</button>
        <button id="adCancelBtn" class="addBtn" style="background:#525868; display:none;" onclick="resetAdForm()">Cancel Edit</button>

        <div style="margin-top: 15px;" id="adminAdsList"></div>
      </div>
    </div>

    <!-- Lists -->
    <div class="admin-card-section">
      <div class="accordion-header" onclick="toggleAccordion('secItems', 'iconItems')">
        <h3>📹 Videos List</h3>
        <span id="iconItems">▼</span>
      </div>
      <div id="secItems" class="accordion-body">
        <div id="adminMovies"></div>
      </div>
    </div>

    <div class="admin-card-section">

function processVideoLink(input) {
  if (!input) return { type: 'iframe', url: '' };
  let target = input.trim();
  const srcMatch = target.match(/src=["']([^"']+)["']/);
  if (srcMatch) target = srcMatch[1];
  
  if (target.match(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i) || target.startsWith("blob:")) {
    return { type: 'video', url: target };
  }
  
  // Avcaption or generic embed link parser
  if (target.includes("avcaption.com")) {
    return { type: 'iframe', url: target };
  }

  let ytMatch = target.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
  if (ytMatch && ytMatch[1]) {
    return { type: 'iframe', url: `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1` };
  }
  
  return { type: 'iframe', url: target };
}

async function uploadFileToSupabase(file) {
  if (!file) return "";
  const cleanFileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
  const uploadEndpoint = `${SUPABASE_URL}/storage/v1/object/thumbnails/${cleanFileName}`;

  try {
    const res = await fetch(uploadEndpoint, {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'x-upsert': 'true'
      },
      body: file
    });

    if (res.ok) {
      return `${SUPABASE_URL}/storage/v1/object/public/thumbnails/${cleanFileName}`;
    }
  } catch(e) {
    console.error("Upload failed", e);
  }
  return "";
}

  let related = movies.filter(m => m.id !== currentMovie.id && (
    (m.category && m.category.toLowerCase() === currentCat) ||
    (m.actor && m.actor.toLowerCase() === currentActor)
  ));

  if (related.length < 4) {
    const others = movies.filter(m => m.id !== currentMovie.id && !related.includes(m));
    related = related.concat(others);
  }

  related.slice(0, 6).forEach(movie => {
    const card = document.createElement("div");
    card.className = "grid-movie";
    card.onclick = function(){ openMovie(movie); };
    const imgUrl = getValidImg(movie);

async function saveMovie(){
  const editIdInput = document.getElementById("editMovieId").value;

  const rawLink = document.getElementById("movieLink").value.trim();
  const category = document.getElementById("movieCategory").value.trim() || "General";
  const tags = document.getElementById("movieTags").value.trim();
  const actor = document.getElementById("movieActor").value.trim();
  const file = document.getElementById("movieImage").files[0];

  if(!title || !rawLink) return alert("Title and Link required!");

  let posterUrl = document.getElementById("preview").src;
  if(!posterUrl || posterUrl === window.location.href) posterUrl = "";

  if(file){
    let uploaded = await uploadFileToSupabase(file);
    if(uploaded) posterUrl = uploaded;
  }

  const movieData = { 
    title, 
    file_code: rawLink, 
    poster_url: posterUrl, 
    turboviplay_url: rawLink,
    thumbnail_url: posterUrl,
    category, 
    tags, 
    actor 
  };

  try {
    let res;
    if(editIdInput && editIdInput !== "") {
      res = await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${editIdInput}`, {
        method: 'PATCH',
        headers: {
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(movieData)
      });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/videos`, {
        method: 'POST',
        headers: {
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(movieData)
      });
    }

    if(res.ok) {
      alert(editIdInput ? "✅ Video Updated Successfully!" : "✅ Video Added Successfully!");
      resetVideoForm();
      loadAllData();
    } else {
      const errText = await res.text();
      alert("Failed to save video: " + errText);
    }
  } catch(e) {
    alert("An error occurred. Check connection.");
  }
}

async function saveActor(){
  const editIdInput = document.getElementById("editActorId").value;
  const name = document.getElementById("actorName").value.trim();
  const file = document.getElementById("actorImage").files[0];
  const bannerFile = document.getElementById("actorBannerImage").files[0];

  if(!name) return alert("Actor name required!");

  let imageUrl = document.getElementById("actorPreview").src;
  if(!imageUrl || imageUrl === window.location.href) imageUrl = "";
  if(file){
    let uploaded = await uploadFileToSupabase(file);
    if(uploaded) imageUrl = uploaded;
  }

  let bannerUrl = document.getElementById("actorBannerPreview").src;
  if(!bannerUrl || bannerUrl === window.location.href) bannerUrl = "";
  if(bannerFile){
    let uploadedBanner = await uploadFileToSupabase(bannerFile);
    if(uploadedBanner) bannerUrl = uploadedBanner;
  }

  const actorData = { name, image_url: imageUrl, banner_url: bannerUrl };

  try {
    let res;
    if(editIdInput && editIdInput !== "") {
      res = await fetch(`${SUPABASE_URL}/rest/v1/performers?id=eq.${editIdInput}`, {
        method: 'PATCH',
        headers: {
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(actorData)
      });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/performers`, {
        method: 'POST',
        headers: {
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(actorData)
      });
    }

    if(res.ok) {
      alert(editIdInput ? "✅ Actor Updated Successfully!" : "✅ Actor Added Successfully!");
      resetActorForm();
      loadAllData();
    } else {
      const errText = await res.text();
      alert("Failed to save actor: " + errText);
    }
  } catch(e) {
    alert("An error occurred. Check connection.");
  }
}

document.getElementById("search").addEventListener("input", function(){
  const q = this.value.toLowerCase().trim();
  const sugBox = document.getElementById("suggestions");
  sugBox.innerHTML = "";
  
  if(!q){
    sugBox.style.display = "none";
    return;
  }

  let resultsCount = 0;

  performers.forEach(p => {
    if(p.name.toLowerCase().includes(q)) {
      resultsCount++;
      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.innerHTML = `<span>👤</span> <span>Actor: <b>${escapeHTML(p.name)}</b></span>`;
      item.onclick = function(){
        sugBox.style.display = "none";
        document.getElementById("search").value = "";
        openActorProfile(p.name);
      };
      sugBox.appendChild(item);
    }
  });

  movies.forEach(movie => {
    if(movie.title.toLowerCase().includes(q)) {
      resultsCount++;
      const itemDiv = document.createElement("div");
      itemDiv.className = "suggestion-item";
      itemDiv.innerHTML = `<span>🎬</span> <span>Video: <b>${escapeHTML(movie.title)}</b></span>`;
      itemDiv.onclick = function(){
        sugBox.style.display = "none";
        document.getElementById("search").value = "";
        openMovie(movie);
      };
      sugBox.appendChild(itemDiv);
    }
  });

  if(resultsCount > 0){
    sugBox.style.display = "block";
  } else {
    sugBox.style.display = "none";
  }
});
</script>
